 'Alibori':['Banikoara','Gogounou','Kandi','Karimama','Malanville','Ségbana'],

function nk(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
var COMMUNES=[];
Object.keys(DEP).forEach(function(d){DEP[d].forEach(function(c){COMMUNES.push({n:c,d:d,k:nk(c)})})});
COMMUNES.sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:0});
function communeFind(q){var k=nk(q);return COMMUNES.filter(function(c){return c.k===k})[0]||null}
function communeSearch(q){
  var k=nk(q);if(!k)return COMMUNES.slice();
  var a=[],b=[];
  COMMUNES.forEach(function(x){
    if(x.k.indexOf(k)===0)a.push(x);
    else if(x.n.split(/[^A-Za-zÀ-ÿ]+/).some(function(w){return w&&nk(w).indexOf(k)===0}))b.push(x);
  });
  return a.concat(b);
}
function matchVille(ville,q){
  var k=nk(q);if(!k)return true;
  return communeFind(q)?nk(ville)===k:nk(ville).indexOf(k)===0;
}
function hl(name,q){
  var kq=nk(q);if(!kq||nk(name).indexOf(kq)!==0)return esc(name);
  var cnt=0,i=0;while(i<name.length&&cnt<kq.length){if(nk(name.charAt(i)))cnt++;i++}

/* ---------- utilitaires ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number(n||0).toLocaleString('fr-FR')+' FCFA'}
function dt(ts){return new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function toast(m,t){var el=document.createElement('div');el.className='tt '+(t||'');el.textContent=m;var c=document.getElementById('toast');c.appendChild(el);setTimeout(function(){el.remove()},3800)}
function go(h){
  cur=h.charAt(0)==='/'?h:'/'+h;
  try{if(location.hash!=='#'+cur)location.hash='#'+cur}catch(e){}
  setTimeout(render,0);
}
function hue(id){var s=0;for(var i=0;i<id.length;i++)s=(s*31+id.charCodeAt(i))%360;return s}
function cover(l){
  if(l.photos&&l.photos.length)return '<div class="cover"><img loading="lazy" alt="'+esc(l.titre)+'" src="'+l.photos[0]+'"></div>';
  var h=hue(l.id);return '<div class="cover" style="background:linear-gradient(135deg,hsl('+h+',55%,45%),hsl('+((h+50)%360)+',60%,60%))">🏠</div>';
}
function tags(l,n){return (l.equip||[]).slice(0,n||9).map(function(k){return '<span class="tag">'+esc(EQUIP[k]||k)+'</span>'}).join('')}
function stLabel(s){return {active:'Active',veille:'En veille',inactive:'Inactive'}[s]||s}
function vLabel(v){return {pending:'En attente de validation',ok:'Validée',refuse:'Refusée'}[v]||v}
function mapsUrl(l){return 'https://www.google.com/maps?q='+encodeURIComponent(l.lat+','+l.lng)}
function notify(uid,title,text,type){db.notifs.push({id:nid('n'),userId:uid,title:title,text:text,type:type||'info',date:nowT(),read:false})}

/* ---------- règles métier ---------- */
function checkInactive(l){
  if(l.statut!=='active')return;
  var rs=db.requests.filter(function(r){return r.listingId===l.id&&r.date>=(l.reactAt||0)&&r.reponse!=='pending'}).sort(function(a,b){return a.date-b.date});
  var n=0;for(var i=rs.length-1;i>=0;i--){if(rs[i].reponse==='ignoree')n++;else break}
  if(n>=3){l.statut='inactive';notify(l.ownerId,'Annonce désactivée','Votre annonce « '+l.titre+' » a été désactivée automatiquement suite à plusieurs demandes de disponibilité restées sans réponse. Veuillez confirmer que votre logement est toujours disponible pour réactiver l’annonce.','warn')}
}
function sweep(){
  var ch=false;
  db.requests.forEach(function(r){
    if(r.reponse==='pending'&&nowT()-r.date>H24){r.reponse='ignoree';r.dateRep=nowT();ch=true;var l=listing(r.listingId);if(l)checkInactive(l)}
  });
  if(ch)save();
}
function lastRequest(uid,lid){
  var rs=db.requests.filter(function(r){return r.userId===uid&&r.listingId===lid}).sort(function(a,b){return b.date-a.date});
  return rs[0]||null;
}
function confirmedOk(uid,lid){
  var r=lastRequest(uid,lid);
  return r&&r.reponse==='oui'&&nowT()-r.dateRep<H24?r:null;
}
function unlocked(uid,lid){return db.unlocks.find(function(x){return x.userId===uid&&x.listingId===lid})||null}
function doUnlock(u,l,via){
  db.unlocks.push({id:nid('k'),userId:u.id,listingId:l.id,date:nowT(),via:via});
  notify(l.ownerId,'Coordonnées achetées','Un démarcheur vient d’acheter les coordonnées de « '+l.titre+' ».');
}

}

function vPay(id){
  var u=me(),l=listing(id);
  if(!l||l.deleted)return notFound('Annonce introuvable.');
  if(u.role!=='demarcheur')return notFound('Seuls les démarcheurs peuvent acheter des coordonnées.');
  if(unlocked(u.id,l.id)){go('/annonce/'+l.id);return ''}

/* ---------- navigation / rendu ---------- */
function renderNav(h){
  var u=me(),ln=function(p,t,x){return '<a href="#'+p+'" class="'+(h.indexOf(p)===0&&(p!=='/'||h==='/')?'on':'')+'" onclick="A.closeMenu()">'+t+(x||'')+'</a>'};
  var s=ln('/','Accueil')+ln('/chambres','Trouver une chambre');
  if(u){
    if(u.role==='demarcheur')s+=ln('/achats','Mes coordonnées');
    if(u.role==='proprio')s+=ln('/mes-annonces','Mes annonces')+ln('/publier','Publier');
    if(u.role==='admin')s+=ln('/admin','Administration',pendBadge());
    var un=db.notifs.filter(function(n){return n.userId===u.id&&!n.read}).length;
    s+=ln('/profil','👤 '+esc(u.nom.split(' ')[0]),un?'<span class="badge">'+un+'</span>':'')+'<button class="lnk" onclick="A.logout()">Déconnexion</button>';
  }else{
    s+=ln('/publier','Publier une annonce')+ln('/connexion','Connexion')+'<a class="btn s" href="#/inscription" onclick="A.closeMenu()">Inscription</a>';
  }
  document.getElementById('nav').innerHTML=s;
}
function render(scroll){
  sweep();
  var h=cur,p=h.split('/').filter(Boolean),r=p[0]||'',u=me(),html='';
  function need(roles){
    if(!u){nextAfterLogin=h;toast('Connectez-vous pour continuer.');go('/connexion');return false}
    if(roles&&roles.indexOf(u.role)<0){html=notFound('Accès réservé.');return false}
    return true;
  }
  if(r==='')html=vHome();
  else if(r==='chambres')html=vList();
  else if(r==='annonce')html=vDetail(p[1]);
  else if(r==='conditions')html=vTerms();
  else if(r==='inscription')html=vAuth('reg');
  else if(r==='connexion')html=vAuth('log');
  else if(r==='paiement'){if(need(['demarcheur']))html=vPay(p[1])}
  else if(r==='achats'){if(need(['demarcheur']))html=vPurchases()}
  else if(r==='publier'){
    if(!u){nextAfterLogin=h;toast('Connectez-vous ou créez un compte propriétaire pour publier.');go('/connexion');return}
    if(u.role==='demarcheur')html=notFound('Seuls les propriétaires peuvent publier. Créez un compte propriétaire.');
    else html=vForm(p[1]);
  }
  else if(r==='mes-annonces'){if(need(['proprio']))html=vMine()}
  else if(r==='profil'){if(need())html=vProfile()}
  else if(r==='admin'){if(need(['admin']))html=vAdmin()}
  else html=notFound('Page introuvable.');
  document.getElementById('app').innerHTML=html;
  renderNav(h);
  if(scroll!==false)window.scrollTo(0,0);
}

  filter:function(e){e.preventDefault();F={ville:v('fv'),quartier:v('fq').trim(),min:v('fmin'),max:v('fmax'),eq:Array.prototype.map.call(document.querySelectorAll('input[name=eq]:checked'),function(x){return x.value})};render(false);return false},
  resetFilter:function(){F={ville:'',quartier:'',min:'',max:'',eq:[]};render(false)},
  needLogin:function(back){nextAfterLogin=back;go('/connexion')},
  fill:function(id,pw){document.getElementById('a_id').value=id;document.getElementById('a_mdp').value=pw||'demo123'},
  register:function(e){
    e.preventDefault();
    var nom=v('a_nom').trim(),tel=v('a_tel').trim(),email=v('a_email').trim().toLowerCase(),mdp=v('a_mdp'),role=v('a_role');
    if(normTel(tel).length<8){toast('Numéro de téléphone invalide.','err');return false}
    if(db.users.some(function(x){return normTel(x.tel)===normTel(tel)||(email&&x.email===email)})){toast('Un compte existe déjà avec ce téléphone ou cet e-mail.','err');return false}
    var u={id:nid('u'),nom:nom,tel:tel,email:email,mdp:mdp,role:role,date:nowT(),credits:0,suspendu:false};
    db.users.push(u);db.session=u.id;save();toast('Bienvenue sur BÉNIN IMMO !','ok');
    var n=nextAfterLogin;nextAfterLogin=null;go(n||(role==='proprio'?'/publier':'/chambres'));return false;
  },
  login:function(e){
    e.preventDefault();
    var id=v('a_id').trim().toLowerCase(),pw=v('a_mdp');
    var u=db.users.find(function(x){return (x.email&&x.email===id)||normTel(x.tel)===normTel(id)&&normTel(id).length>=8});
    if(!u||u.mdp!==pw){toast('Identifiants incorrects.','err');return false}
    if(u.suspendu){toast('Ce compte est suspendu. Contactez l’administration.','err');return false}
    db.session=u.id;save();toast('Connexion réussie.','ok');
    var n=nextAfterLogin;nextAfterLogin=null;go(n||(u.role==='admin'?'/admin':u.role==='proprio'?'/mes-annonces':'/chambres'));return false;
  },
  logout:function(){db.session=null;save();A.closeMenu();go('/');render()},
  verify:function(id){
    var u=me(),l=listing(id);
    if(!u||u.role!=='demarcheur'){toast('Seuls les démarcheurs peuvent vérifier la disponibilité.','err');return}
    if(!l||!isPublic(l)){toast('Cette annonce n’accepte plus de demandes.','err');render(false);return}
    var r=lastRequest(u.id,id);
    if(r&&r.reponse==='pending'){toast('Une demande est déjà en cours.');return}
    db.requests.push({id:nid('r'),listingId:id,userId:u.id,date:nowT(),reponse:'pending',dateRep:null});
    notify(l.ownerId,'Nouvelle demande de disponibilité','Un utilisateur souhaite savoir si votre chambre « '+l.titre+' » est toujours disponible. Répondez OUI ou NON depuis « Mes annonces ». (Notification également envoyée par WhatsApp.)');
    save();toast('Demande envoyée au propriétaire.','ok');render(false);
  },
  respond:function(rid,rep){
    var r=db.requests.find(function(x){return x.id===rid}),u=me();
    if(!r||r.reponse!=='pending'){toast('Cette demande n’est plus active.','err');render(false);return}
    var l=listing(r.listingId);if(!l||l.ownerId!==u.id)return;
    r.reponse=rep;r.dateRep=nowT();
    if(rep==='oui'){notify(r.userId,'Chambre disponible','La chambre « '+l.titre+' » est disponible. Vous pouvez débloquer les coordonnées pendant 24 h.');toast('Réponse envoyée : OUI','ok')}
    else{l.statut='veille';notify(r.userId,'Chambre indisponible','Le propriétaire a indiqué que « '+l.titre+' » n’est plus disponible.');notify(l.ownerId,'Annonce mise en veille','Votre annonce a été mise en veille car vous avez indiqué que le logement n’est plus disponible.','warn');toast('Annonce mise en veille.')}
    save();render(false);
  },
  reactivate:function(id){
    var l=listing(id),u=me();if(!l||(l.ownerId!==u.id&&u.role!=='admin'))return;
    l.statut='active';l.reactAt=nowT();notify(l.ownerId,'Annonce réactivée','Votre annonce « '+l.titre+' » est de nouveau visible.');save();toast('Annonce réactivée.','ok');render(false);
  },
  delListing:function(id){var l=listing(id);if(!l||!confirm('Supprimer définitivement cette annonce ?'))return;l.deleted=true;save();toast('Annonce supprimée.');render(false)},
  pay:function(e,id){
    if(!ack()){e.preventDefault();toast('Cochez la case de compréhension avant de payer.','err');return false}
    e.preventDefault();
    var u=me(),l=listing(id);
    if(!confirmedOk(u.id,id)||!isPublic(l)){toast('La confirmation a expiré. Vérifiez à nouveau la disponibilité.','err');go('/annonce/'+id);return false}
    var of=document.querySelector('input[name=of]:checked').value,pm=document.querySelector('input[name=pm]:checked').value;
    var mname=METHODS.filter(function(m){return m[0]===pm})[0][1];
    var montant=of==='one'?PRICE_ONE:PACKS[of],lib=of==='one'?'Coordonnées – '+l.titre:'Pack '+of+' coordonnées';
    var b=document.getElementById('pb');b.disabled=true;b.textContent='Validation du paiement…';
    setTimeout(function(){
      db.payments.push({id:nid('p'),userId:u.id,listingId:id,montant:montant,date:nowT(),statut:'Validé',methode:mname,libelle:lib});
      if(of!=='one')u.credits+=Number(of)-1;
      doUnlock(u,l,'paiement');save();
      notify(u.id,'Paiement validé','Paiement de '+fmt(montant)+' validé. Coordonnées de « '+l.titre+' » débloquées.');
      toast('Paiement validé. Coordonnées débloquées !','ok');go('/annonce/'+id);
    },1300);
    return false;
  },
  useCredit:function(id){
    if(!ack()){toast('Cochez la case de compréhension avant de débloquer.','err');return}
    var u=me(),l=listing(id);
    if(!confirmedOk(u.id,id)||!isPublic(l)||u.credits<1){toast('Impossible de débloquer : vérifiez la disponibilité.','err');go('/annonce/'+id);return}
    u.credits--;doUnlock(u,l,'credit');save();toast('Coordonnées débloquées avec 1 crédit.','ok');go('/annonce/'+id);
  },
  geo:function(){
    if(!navigator.geolocation){toast('Géolocalisation non disponible.','err');return}
    navigator.geolocation.getCurrentPosition(function(p){document.getElementById('f_lat').value=p.coords.latitude.toFixed(6);document.getElementById('f_lng').value=p.coords.longitude.toFixed(6);toast('Position GPS renseignée.','ok')},function(){toast('Position refusée ou indisponible.','err')},{enableHighAccuracy:true,timeout:10000});
  },
  photos:function(inp){
    var files=Array.prototype.slice.call(inp.files),room=4-formPhotos.length;
    if(room<=0){toast('4 photos maximum.','err');inp.value='';return}
    files.slice(0,room).forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){var im=new Image();im.onload=function(){
        var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);formPhotos.push(c.toDataURL('image/jpeg',.72));document.getElementById('pv').innerHTML=photoPrev();
      };im.src=rd.result};rd.readAsDataURL(f);
    });
    inp.value='';
  },
  delPhoto:function(i){formPhotos.splice(i,1);document.getElementById('pv').innerHTML=photoPrev()},
  saveListing:function(e,id){
    e.preventDefault();var u=me();
    var cm=communeFind(v('f_ville'));
    if(!cm){toast('Choisissez une commune dans la liste des 77 communes du Bénin.','err');return false}
    var lat=parseFloat(v('f_lat')),lng=parseFloat(v('f_lng'));
    if(isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180){toast('Coordonnées GPS invalides.','err');return false}
    var data={titre:v('f_titre').trim(),ville:cm.n,quartier:v('f_quartier').trim(),repere:v('f_repere').trim(),adresse:v('f_adresse').trim(),lat:lat,lng:lng,prix:Number(v('f_prix')),caution:Number(v('f_caution')),nb:Number(v('f_nb')),dispo:v('f_dispo'),tel:v('f_tel').trim(),desc:v('f_desc').trim(),equip:Array.prototype.map.call(document.querySelectorAll('input[name=feq]:checked'),function(x){return x.value}),photos:formPhotos.slice()};
    if(id){var l=listing(id);Object.keys(data).forEach(function(k){l[k]=data[k]});save();toast('Annonce modifiée.','ok');go(u.role==='admin'?'/admin':'/mes-annonces')}
    else{data.id=nid('l');data.ownerId=u.id;data.statut='active';data.valide='pending';data.reactAt=0;data.deleted=false;data.date=nowT();db.listings.push(data);
      db.users.filter(function(x){return x.role==='admin'}).forEach(function(a){notify(a.id,'Annonce à valider','Nouvelle annonce : « '+data.titre+' ».')});
      save();toast('Annonce envoyée ! Elle sera visible après validation par l’équipe.','ok');go('/mes-annonces')}
    return false;
  },
  saveProfile:function(e){
    e.preventDefault();var u=me(),tel=v('p_tel').trim(),email=v('p_email').trim().toLowerCase();
    if(db.users.some(function(x){return x.id!==u.id&&(normTel(x.tel)===normTel(tel)||(email&&x.email===email))})){toast('Téléphone ou e-mail déjà utilisé.','err');return false}
    u.nom=v('p_nom').trim();u.tel=tel;u.email=email;if(v('p_mdp'))u.mdp=v('p_mdp');save();toast('Profil mis à jour.','ok');render(false);return false;
  },
  tab:function(t){adminTab=t;render(false)},
  terms:function(){
    A.closeModal();
    var d=document.createElement('div');d.id='modal';d.className='ov';
    d.innerHTML='<div class="mb"><button class="btn s o x" type="button" onclick="A.closeModal()">✕ Fermer</button>'+vTerms()+'</div>';
    d.addEventListener('mousedown',function(e){if(e.target===d)A.closeModal()});
    document.body.appendChild(d);document.body.style.overflow='hidden';
  },
  closeModal:function(){var m=document.getElementById('modal');if(m){m.remove();document.body.style.overflow=''}},
  admUser:function(id,a){
    var u=user(id);if(!u||u.role==='admin')return;
    if(a==='susp')u.suspendu=true;if(a==='react')u.suspendu=false;
    if(a==='del'){if(!confirm('Supprimer ce compte ?'))return;db.users=db.users.filter(function(x){return x.id!==id});db.listings.forEach(function(l){if(l.ownerId===id)l.deleted=true})}
    save();render(false);
  },
  admList:function(id,a){
    var l=listing(id);if(!l)return;
    if(a==='ok'){l.valide='ok';notify(l.ownerId,'Annonce validée','Votre annonce « '+l.titre+' » est maintenant visible par les démarcheurs.')}
    if(a==='refuse'){l.valide='refuse';notify(l.ownerId,'Annonce refusée','Votre annonce « '+l.titre+' » a été refusée. Modifiez-la puis contactez l’administration.','warn')}
    if(a==='react'){l.statut='active';l.reactAt=nowT();notify(l.ownerId,'Annonce réactivée','Votre annonce « '+l.titre+' » est de nouveau active.')}
    if(a==='del'){if(!confirm('Supprimer cette annonce ?'))return;l.deleted=true}
    save();render(false);
  },
  skip:function(){db.offset+=H24+60000;sweep();save();toast('Temps avancé de 24 h.');render(false)},
  reset:function(){if(!confirm('Effacer toutes les données et revenir à la démonstration ?'))return;localStorage.removeItem(KEY);db=seed();go('/');render()}
};
function v(id){var e=document.getElementById(id);return e?e.value:''}
function ack(){var e=document.getElementById('ack');return !!(e&&e.checked)}

/* ---------- liste déroulante des communes ---------- */
function ddOf(i){return i.parentNode.querySelector('.dd')}
function ddOpen(i){
  var dd=ddOf(i),res=communeSearch(i.value);
  dd.innerHTML=res.length?res.map(function(c){return '<li role="option" data-v="'+esc(c.n)+'">'+hl(c.n,i.value)+'<small>'+esc(c.d)+'</small></li>'}).join(''):'<li class="no">Aucune commune ne commence par « '+esc(i.value.trim())+' »</li>';
  dd.classList.remove('hide');
}
function ddClose(){Array.prototype.forEach.call(document.querySelectorAll('.dd'),function(d){d.classList.add('hide')})}
function isCombo(el){return !!(el&&el.matches&&el.matches('input[data-combo]'))}
document.addEventListener('focusin',function(e){if(isCombo(e.target))ddOpen(e.target)});
document.addEventListener('input',function(e){if(isCombo(e.target))ddOpen(e.target)});
document.addEventListener('mousedown',function(e){
  var li=e.target.closest&&e.target.closest('.dd li[data-v]');
  if(li){e.preventDefault();var i=li.closest('.cmb').querySelector('input');i.value=li.getAttribute('data-v');ddOf(i).classList.add('hide');return}
  if(!(e.target.closest&&e.target.closest('.cmb')))ddClose();
});
document.addEventListener('keydown',function(e){
  var i=e.target;if(!isCombo(i))return;
  var dd=ddOf(i),items=dd.querySelectorAll('li[data-v]'),cur=dd.querySelector('li.act'),idx=cur?Array.prototype.indexOf.call(items,cur):-1;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(dd.classList.contains('hide'))ddOpen(i);
    items=dd.querySelectorAll('li[data-v]');if(!items.length)return;
    if(cur)cur.classList.remove('act');
    idx=e.key==='ArrowDown'?(idx+1)%items.length:(idx<=0?items.length-1:idx-1);
    items[idx].classList.add('act');items[idx].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    if(!dd.classList.contains('hide')&&cur){e.preventDefault();i.value=cur.getAttribute('data-v');dd.classList.add('hide')}
  }else if(e.key==='Escape'||e.key==='Tab'){dd.classList.add('hide')}
});

document.getElementById('yr').textContent=new Date().getFullYear();
window.addEventListener('hashchange',function(){var h=location.hash.replace(/^#/,'')||'/';if(h!==cur){cur=h;render()}});
/* tous les liens internes passent par ce gestionnaire : ils fonctionnent même dans un aperçu isolé */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;
  e.preventDefault();
  if(a.hasAttribute('data-modal')){A.terms();return}
  A.closeModal();A.closeMenu();go(a.getAttribute('href').slice(1));
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')A.closeModal()});
render();
})();
</script>
